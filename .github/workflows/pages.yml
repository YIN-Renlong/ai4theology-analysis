name: Publish AI4Theology demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Rebuild public analysis data
        run: python3 scripts/build_data.py
      - name: Analyze collaboration patterns and lexical returns
        run: python3 scripts/analyze_collaboration.py
      - name: Build the complete synoptic edition
        run: python3 scripts/build_edition.py
      - name: Verify the analysis export
        run: python3 -m unittest discover -s tests -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
